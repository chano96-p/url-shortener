services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: localpw
      POSTGRES_DB: shortener
    ports: ['5433:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  pgdata: